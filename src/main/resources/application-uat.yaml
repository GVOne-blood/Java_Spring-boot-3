spring:
  config:
    activate:
      on-profile: dev
    datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL5Dialect
          format_sql: true
          use_sql_comments: true
          show_sql: true
      hibernate:
        ddl-auto: update
  springdoc:
    openapi:
      api-docs:
        enalbed: true
      swagger-ui:
        enabled: true
  openapi:
    server:
      api-docs-url: /v3/api-docs
      server : http://localhost:${server.port}
      title : API document
      description : API document for springboot
      version : 1.0.0